[package]
name = "mindbell"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "mindbell"
harness = false # нужно для esp-idf

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[features]
default = []
# Диагностическая сборка: устройство НЕ уходит в deep sleep (USB-Serial-JTAG не
# отваливается → логи идут непрерывно) и НЕ управляет мотором (убираем пусковой
# ток/просадку из уравнения). Запуск: `cargo run --release --features diag`.
diag = []
# Automatic light sleep: CPU дремлет между событиями, BLE остаётся в эфире.
# Требует CONFIG_PM_ENABLE=y и CONFIG_FREERTOS_USE_TICKLESS_IDLE=y в sdkconfig.
# По умолчанию ВЫКЛ — для отладки удобнее непрерывный лог при полном бодрствовании.
light_sleep = []

[dependencies]
log = "0.4"
anyhow = "1"
esp-idf-svc = "0.49"
esp32-nimble = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embuild = "0.32"

# Примечание: версии esp-idf-svc / esp32-nimble быстро эволюционируют, и при
# свежем toolchain их API мог немного измениться (сигнатуры BLE-колбэков, имена
# в модуле adc). Если что-то не собирается — сверьтесь с примерами из README
# соответствующего крейта той версии, что подтянул cargo.

[patch.crates-io]
# esp-idf-svc 0.49.1 хардкодит `*const i8` для C-строк (tls.rs/cstr.rs). В Rust
# 1.84 знаковость core::ffi::c_char на RISC-V сменилась на u8 → ошибки сборки на
# свежем тулчейне. Используем локальную копию 0.49.1 с правкой только этих мест
# на core::ffi::c_char (TLS мы не используем, но модуль компилируется всегда).
# Версия та же (0.49.1) → esp32-nimble 0.8.2 / наш main.rs не трогаем.
esp-idf-svc = { path = "vendor/esp-idf-svc" }
